services:
  api:
    build: ./api
    image: drop_api
    container_name: drop_api
    environment:
      - DATA_DIR=/data
    volumes:
      - drop_data:/data        # data.json 보관 (컨테이너를 다시 만들어도 유지)
    restart: unless-stopped

  nginx:
    build: ./nginx
    image: drop_nginx
    container_name: drop_nginx
    ports:
      - "8080:80"              # 브라우저 → 호스트 8080 → nginx 80
    depends_on:
      - api
    restart: unless-stopped

volumes:
  drop_data:
