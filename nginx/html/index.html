<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DROP · 한정판 선착순 판매</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="#products" data-tab="products">DROP</a>
      <nav class="tabs" aria-label="메뉴">
        <button type="button" class="tab is-active" data-tab="products" aria-current="page">상품</button>
        <button type="button" class="tab" data-tab="orders">내 주문</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <!-- 상품 목록 -->
    <section id="products" class="panel" aria-labelledby="products-title">
      <div class="panel-head">
        <h1 id="products-title">정해진 시각, 한정 수량</h1>
        <p class="lede">판매가 시작되면 먼저 구매한 순서대로 재고가 줄어듭니다. 상품마다 1인 1개까지 구매할 수 있습니다.</p>
      </div>
      <p id="products-status" class="notice" role="status" hidden></p>
      <ul id="product-list" class="drop-list"></ul>
    </section>

    <!-- 내 주문 -->
    <section id="orders" class="panel" aria-labelledby="orders-title" hidden>
      <div class="panel-head">
        <h1 id="orders-title">내 주문</h1>
        <p class="lede">구매할 때 입력한 연락처로 주문을 조회하고 취소할 수 있습니다. 취소하면 재고가 다시 늘어납니다.</p>
      </div>
      <form id="orders-form" class="inline-form">
        <label for="orders-contact">연락처</label>
        <input id="orders-contact" name="contact" type="text" autocomplete="tel" placeholder="010-1234-5678 또는 이메일" required>
        <button type="submit" class="btn btn-primary">주문 조회</button>
      </form>
      <p id="orders-status" class="notice" role="status" hidden></p>
      <ul id="order-list" class="order-list"></ul>
    </section>
  </main>

  <!-- 구매 창 -->
  <dialog id="buy-dialog" aria-labelledby="buy-title">
    <form id="buy-form" method="dialog">
      <h2 id="buy-title">구매하기</h2>
      <p id="buy-product" class="buy-product"></p>

      <div class="field">
        <label for="buy-nickname">닉네임</label>
        <input id="buy-nickname" name="nickname" type="text" maxlength="20" autocomplete="nickname" required>
      </div>
      <div class="field">
        <label for="buy-contact">연락처</label>
        <input id="buy-contact" name="contact" type="text" autocomplete="tel" placeholder="010-1234-5678 또는 이메일" required>
        <p class="hint">주문 조회와 취소에 사용합니다.</p>
      </div>

      <p id="buy-result" class="result" role="alert" hidden></p>

      <div class="dialog-actions">
        <button type="button" id="buy-cancel" class="btn btn-ghost">닫기</button>
        <button type="submit" id="buy-submit" class="btn btn-primary">구매하기</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
